#   且 lock=true，故主点差异不影响任何裁剪值。
#   外参/温度/时间约定**完全沿用** configs/EGO-4B/DCD111-523/params_cam.yaml（同一整机布局：
#     cam_1 水平基线约 119 mm、cam_2 / cam_3 相对 cam_0 垂直偏移 60 mm），未发明新的符号约定。
#   真实标定到位后请直接替换本文件。
